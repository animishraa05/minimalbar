; made by ani - Modern & Lightweight
include-file = ~/.config/polybar/modules/modules.ini
include-file = /home/ani/.config/polybar/modules/aniii_colors.ini

[bar/i3_bar]
width = 100%
height = 25pt
radius = 10
dpi = 100

background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0pt

module-margin = 0
padding = 2
spacing = 0
separator = ""

font-0 = "JetBrainsMono Nerd Font Mono:size=11;2"

; All modules kept, organized cleanly
modules-left = rofi i3 tray xwindow ncspot whitenoise
modules-center = time pomodoro
modules-right = filesystem cpu temp memory battery vol-down pulseaudio vol-up wifi network-speed system-updates

cursor-click = pointer
enable-ipc = true
wm-restack = i3
offset-y = 4
