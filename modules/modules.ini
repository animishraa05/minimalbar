;==========================================================
;               MODULES - Clean & Minimal
;==========================================================

[module/rofi]
type = custom/text
format = "  Menu  "
format-foreground = ${colors.fg}
click-left = rofi -show drun -config "/home/ani/.config/rofi/main_menu.rasi"
click-right = exec /home/ani/.config/rofi/power_menu.sh

;==========================================================

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
fuzzy-match = true

ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8

format = <label-state> <label-mode>
format-padding = 2
label-mode = %mode%
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.red}
label-mode-padding = 2

label-focused = %icon%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.green}
label-focused-padding = 2

label-unfocused = %icon%
label-unfocused-foreground = ${colors.shade-3}
label-unfocused-padding = 2

label-visible = %icon%
label-visible-foreground = ${colors.cyan}
label-visible-padding = 2

label-urgent = %icon%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

label-separator = ""

;==========================================================

[module/xwindow]
type = internal/xwindow
format = <label>
label = "  %title%  "
label-maxlen = 35
label-foreground = ${colors.fg}

;==========================================================

[module/time]
type = internal/date
interval = 1
format = <label>
date = %a, %d %b
time = %I:%M %p
label = "  %date% %time%  "
label-foreground = ${colors.fg}

;==========================================================

[module/filesystem]
type = internal/fs
interval = 600
mount-0 = /
format-mounted = <label-mounted>
label-mounted = " Disk: %free%"
label-mounted-foreground = ${colors.fg}

;==========================================================

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = "  CPU: %percentage%%  "
label-foreground = ${colors.fg}

;==========================================================

[module/temp]
type = internal/temperature
interval = 3
thermal-zone = 0
hwmon-path = /sys/class/hwmon/hwmon4/temp1_input
base-temperature = 20
warn-temperature = 70
units = true

format = <label>
label = "%temperature-c%"
label-foreground = ${colors.fg}

format-warn = <label-warn>
label-warn = "%temperature-c%"
label-warn-foreground = ${colors.bg}
label-warn-background = ${colors.red}
label-warn-padding = 2

;==========================================================

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = " RAM: %percentage_used%% "
label-foreground = ${colors.fg}

;==========================================================

[module/pulseaudio]
type = internal/pulseaudio

; Sink to be used, if it exists (find using `pacmd list-sinks`, name field)
; If not specified, uses default sink
; sink = alsa_output.pci-0000_12_00.3.analog-stereo

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = true

; Interval for volume increase/decrease (in percent points)
; Default: 5
interval = 5

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.bg}
format-volume-padding = 1

; Available tags:
;   <label-muted> (default)
;   <ramp-volume>
;   <bar-volume>
format-muted = <label-muted>
format-muted-background = ${colors.bg}
format-muted-padding = 1

; Available tokens:
;   %percentage% (default)
;   %decibels%
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

; Available tokens:
;   %percentage% (default)
;   %decibels%
label-muted = " 󰝟 Muted "
label-muted-foreground = ${colors.shade-1}

; Only applies if <ramp-volume> is used
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.blue}

; Right click to open pavucontrol
click-right = pavucontrol &
; Left click to toggle mute
click-left = pamixer -t

;==========================================================

[module/vol-down]
type = custom/text
format = " 󰝝 "
format-foreground = ${colors.shade-3}
click-left = pamixer -d 5

[module/vol-up]
type = custom/text
format = " 󰝞 "
format-foreground = ${colors.shade-3}
click-left = pamixer -i 5

;==========================================================

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 10px
tray-size = 20px

;==========================================================

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-padding = 1
label-charging = %percentage%%
label-charging-foreground = ${colors.fg}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1
label-discharging = %percentage%%
label-discharging-foreground = ${colors.fg}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.green}
format-full-padding = 1
label-full = "Full"
label-full-foreground = ${colors.fg}

format-low = <animation-low> <label-low>
format-low-padding = 1
label-low = %percentage%%
label-low-foreground = ${colors.red}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-foreground = ${colors.yellow}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

animation-low-0 = 󰂃
animation-low-1 = "  "
animation-low-foreground = ${colors.red}
animation-low-framerate = 500

;==========================================================

;==========================================================
;==========================================================

[module/network-speed]
type = custom/script
exec = ~/.config/polybar/scripts/network_speed.sh
tail = false
interval = 5
format = <label>
label = " %output% "
label-foreground = ${colors.fg}

;==========================================================

[module/ncspot]
type = custom/script
exec = pgrep -x ncspot >/dev/null && echo "󰓇 $(playerctl -p ncspot metadata --format '{{title}} - {{artist}}')" || echo ""
interval = 2
format = <label>
label = " %output% "
label-foreground = ${colors.green}
click-left = playerctl -p ncspot play-pause
click-right = kitty -e ncspot

;==========================================================

[module/whitenoise]
type = custom/script
exec = if [ -f /tmp/whitenoise.state ]; then state=$(cat /tmp/whitenoise.state); if [ "$state" = "playing" ]; then echo "󰈉 "; elif [ "$state" = "paused" ]; then echo "󰐊 "; fi; else echo ""; fi
interval = 2
format = <label>
label = " %output% "
label-foreground = ${colors.cyan}
click-left = ~/.config/i3/scripts/whitenoise.sh

;==========================================================

[module/system-updates]
type = custom/script
exec = ~/.config/polybar/scripts/system_updates.sh
interval = 3600
format = <label>
label = " %output%"
label-foreground = ${colors.fg}

;==========================================================

[module/pomodoro]
type = custom/script
exec = /home/ani/.config/polybar/scripts/pomodoro.sh
interval = 1
click-left = /home/ani/.config/polybar/scripts/pomodoro.sh toggle &
click-right = /home/ani/.config/polybar/scripts/rofi_pomodoro.sh &

;==========================================================

[module/wifi]
type = custom/script
exec = echo " WiFi "
interval = 60
click-left = /home/ani/.config/polybar/scripts/rofi_wifi_menu.sh &
click-right = kitty -e nmtui
format = <label>
label = " WiFi "
label-foreground = ${colors.fg}

;==========================================================

